<!DOCTYPE html>
<html>
<head>
    <title>Smart Spam Detector</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }

        textarea {
            width: 95%;
            height: 150px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            resize: none;
        }

        button {
            padding: 12px 25px;
            margin: 15px 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .check {
            background: #667eea;
            color: white;
        }

        .clear {
            background: #ddd;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📧 Smart Spam Detector</h1>

    <p>Enter your email or message below</p>

    <textarea id="email"
        placeholder="Enter your message here..."></textarea>

    <br>

    <button class="check" onclick="checkSpam()">
        Check Spam
    </button>

    <button class="clear" onclick="clearText()">
        Clear
    </button>

    <div id="result"></div>

</div>

<script>

function checkSpam() {

    let message = document
        .getElementById("email")
        .value
        .toLowerCase();

    let spamWords = [
        "winner",
        "won",
        "prize",
        "free money",
        "click here",
        "congratulations",
        "lottery",
        "claim now",
        "urgent",
        "you have won",
        "cash prize"
    ];

    if (message.trim() === "") {
        document.getElementById("result").innerHTML =
            "⚠️ Please enter a message.";
        return;
    }

    let found = false;

    for (let word of spamWords) {
        if (message.includes(word)) {
            found = true;
            break;
        }
    }

    if (found) {
        document.getElementById("result").innerHTML =
            "⚠️ SPAM DETECTED!";
    } else {
        document.getElementById("result").innerHTML =
            "✅ NOT SPAM";
    }
}

function clearText() {
    document.getElementById("email").value = "";
    document.getElementById("result").innerHTML = "";
}

</script>

</body>
</html>
