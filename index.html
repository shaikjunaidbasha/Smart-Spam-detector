<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Spam Detector</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 170px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 12px;
            outline: none;
            resize: none;
        }

        textarea:focus {
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            margin: 15px 5px 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .check-button {
            background: #667eea;
            color: white;
        }

        .clear-button {
            background: #ddd;
            color: #333;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            min-height: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📧 Smart Spam Detector</h1>

        <p class="description">
            Enter your email or message below to check whether it is spam.
        </p>

        <textarea
            id="message"
            placeholder="Enter your message here...">
        </textarea>

        <br>

        <button class="check-button" onclick="checkSpam()">
            Check Spam
        </button>

        <button class="clear-button" onclick="clearMessage()">
            Clear
        </button>

        <div id="result"></div>

    </div>

    <script>

        function checkSpam() {

            let message = document.getElementById("message").value.toLowerCase().trim();

            let spamWords = [
                "winner",
                "won",
                "prize",
                "free money",
                "click here",
                "congratulations",
                "lottery",
                "claim now",
                "urgent",
                "you have won",
                "cash prize",
                "free gift",
                "limited offer"
            ];

            if (message === "") {
                document.getElementById("result").innerHTML =
                    "⚠️ Please enter a message.";
                return;
            }

            let spamFound = false;

            for (let word of spamWords) {

                if (message.includes(word)) {
                    spamFound = true;
                    break;
                }

            }

            if (spamFound) {

                document.getElementById("result").innerHTML =
                    "⚠️ SPAM DETECTED!";

            } else {

                document.getElementById("result").innerHTML =
                    "✅ NOT SPAM";

            }
        }

        function clearMessage() {

            document.getElementById("message").value = "";

            document.getElementById("result").innerHTML = "";

        }

    </script>

</body>
</html>
